<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>住院藥局收發紀錄查詢平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-secondary mb-4 shadow-sm px-3">
    <div class="container-fluid justify-content-center">
      <span class="navbar-brand mb-0 h1 fs-3"><i class="bi bi-search me-2"></i>住院藥局收發紀錄查詢平台</span>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        
        <div class="row justify-content-center mb-4 border-bottom pb-4 align-items-end">
          <div class="col-md-3">
            <label class="fw-bold fs-5 mb-2 text-primary">開始日期：</label>
            <input type="date" id="startDate" class="form-control form-control-lg text-center fw-bold">
          </div>
          <div class="col-md-3">
            <label class="fw-bold fs-5 mb-2 text-primary">結束日期：</label>
            <input type="date" id="endDate" class="form-control form-control-lg text-center fw-bold">
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="loadRecords()"><i class="bi bi-cloud-download me-2"></i>載入資料</button>
          </div>
        </div>

        <ul class="nav nav-tabs nav-fill mb-4 fs-4" id="recordTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active text-success" id="med-tab" data-bs-toggle="tab" data-bs-target="#med" type="button">📦 出院帶藥 / 氣送</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link text-primary" id="doc-tab" data-bs-toggle="tab" data-bs-target="#doc" type="button">📄 文件收發紀錄</button>
          </li>
                    <li class="nav-item" role="presentation">
            <button class="nav-link text-danger fw-bold" id="undispensed-tab" data-bs-toggle="tab" data-bs-target="#undispensed" type="button">🛑 未發藥交接紀錄</button>
          </li>
<li class="nav-item" role="presentation">
            <button class="nav-link text-warning fw-bold" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button">📊 統計面板</button>
          </li>
        </ul>

        <div class="tab-content" id="recordTabContent">
          
          <div class="tab-pane fade" id="dashboard" role="tabpanel">
            <div class="row g-3 mt-2">
              <!-- KPI 數字區 -->
              <div class="col-md-4">
                <div class="card bg-success text-white text-center shadow-sm border-0">
                  <div class="card-body py-4">
                    <h5 class="card-title fw-bold mb-3"><i class="bi bi-box-seam me-2"></i>帶藥 / 氣送總筆數</h5>
                    <h1 class="display-4 fw-bold" id="kpi-meds">0</h1>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card bg-primary text-white text-center shadow-sm border-0">
                  <div class="card-body py-4">
                    <h5 class="card-title fw-bold mb-3"><i class="bi bi-file-earmark-text me-2"></i>文件收發總筆數</h5>
                    <h1 class="display-4 fw-bold" id="kpi-docs">0</h1>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card bg-danger text-white text-center shadow-sm border-0">
                  <div class="card-body py-4">
                    <h5 class="card-title fw-bold mb-3"><i class="bi bi-exclamation-triangle me-2"></i>未發藥交接總筆數</h5>
                    <h1 class="display-4 fw-bold" id="kpi-ud">0</h1>
                  </div>
                </div>
              </div>
              
              <!-- 圖表區 -->
              <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                  <div class="card-header bg-white fw-bold text-success border-bottom border-success border-2">帶藥 / 氣送作業分佈</div>
                  <div class="card-body" style="height: 300px;">
                    <canvas id="medChart"></canvas>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                  <div class="card-header bg-white fw-bold text-primary border-bottom border-primary border-2">文件類型統計排行</div>
                  <div class="card-body" style="height: 300px;">
                    <canvas id="docChart"></canvas>
                  </div>
                </div>
              </div>
              <div class="col-md-12 mb-4">
                <div class="card shadow-sm border-0">
                  <div class="card-header bg-white fw-bold text-danger border-bottom border-danger border-2">未發藥問題分類統計</div>
                  <div class="card-body" style="height: 300px;">
                    <canvas id="udChart"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
                    <!-- 新增：未發藥交接紀錄 區塊 -->
          <div class="tab-pane fade" id="undispensed" role="tabpanel">
            
            <!-- 藥師輸入表單 -->
            <div class="card shadow-sm border-danger mb-4">
              <div class="card-header bg-danger text-white fw-bold fs-5">
                <i class="bi bi-pencil-square me-2"></i>新增交接紀錄
              </div>
              <div class="card-body">
                <form id="undispensedForm">
                  <div class="row g-3 align-items-end">
                    <div class="col-md-2">
                      <label class="form-label fw-bold text-muted">診別</label>
                      <select id="udClinicType" class="form-select border-danger">
                        <option value="住院藥局" selected>住院藥局</option>
                        <option value="門診藥局">門診藥局</option>
                        <option value="急診藥局">急診藥局</option>
                      </select>
                    </div>
                    <div class="col-md-2">
                      <label class="form-label fw-bold text-muted">處方日期</label>
                      <input type="date" id="udRxDate" class="form-control border-danger" required>
                    </div>
                    <div class="col-md-2">
                      <label class="form-label fw-bold text-muted">領藥號</label>
                      <input type="text" id="udDispenseNo" class="form-control border-danger" required placeholder="例如: 80001">
                    </div>
                    <div class="col-md-2">
                      <label class="form-label fw-bold text-muted">問題分類</label>
                      <select id="udCategory" class="form-select border-danger">
                        <option value="爭議處方" selected>爭議處方</option>
                        <option value="OrderRenew">OrderRenew</option>
                        <option value="重複建檔">重複建檔</option>
                        <option value="物按領藥鍵">物按領藥鍵</option>
                        <option value="護理師要求不發藥">護理師要求不發藥</option>
                        <option value="剩藥帶回">剩藥帶回</option>
                        <option value="其他(填寫備註)">其他(填寫備註)</option>
                      </select>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label fw-bold text-muted">備註/處方建議</label>
                      <textarea id="udNote" class="form-control border-danger" rows="1" placeholder="填寫詳細原因..."></textarea>
                    </div>
                    <div class="col-md-1 text-end">
                      <button type="submit" class="btn btn-danger w-100 fw-bold">送出</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <!-- 全欄位模糊搜尋器 -->
            <div class="filter-box mb-3">
              <input type="text" id="filterUndispensed" class="form-control form-control-lg border-danger" placeholder="🔍 模糊搜尋 (診別/領藥號/問題分類/備註/藥師)...">
            </div>
            
            <!-- 查詢列表 -->
            <div class="table-responsive">
              <table class="table table-hover align-middle fs-5 border">
                <thead class="table-danger">
                  <tr>
                    <th>紀錄時間</th>
                    <th>處方日期</th>
                    <th>診別</th>
                    <th>領藥號</th>
                    <th>問題分類</th>
                    <th>備註/處方建議</th>
                    <th>登錄藥師</th>
                  </tr>
                </thead>
                <tbody id="undispensedRecordsBody"></tbody>
              </table>
            </div>
          </div>
          
<div class="tab-pane fade show active" id="med" role="tabpanel">
            <div class="filter-box row g-3">
              <div class="col-md-4">
                <input type="text" id="filterMedDisp" class="form-control form-control-lg border-success" placeholder="🔍 搜尋 領藥號 (可輸入片段)...">
              </div>
              <div class="col-md-4">
                <input type="text" id="filterMedChart" class="form-control form-control-lg border-success" placeholder="🔍 搜尋 病歷號...">
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle fs-5 border">
                <thead class="table-success">
                  <tr><th>處方日期</th><th>領藥號</th><th>病歷號</th><th>傳送方式</th><th>最新進度 (人員與時間)</th><th>總筆數</th><th>操作</th></tr>
                </thead>
                <tbody id="medRecordsBody"></tbody>
              </table>
            </div>
          </div>

          <div class="tab-pane fade" id="doc" role="tabpanel">
            <div class="filter-box row g-3">
              <div class="col-md-3">
                <select id="filterDocType" class="form-select form-select-lg border-primary">
                  <option value="">📁 所有文件類型</option>
                </select>
              </div>
              <div class="col-md-3">
                <input type="text" id="filterDocChart" class="form-control form-control-lg border-primary" placeholder="🔍 搜尋 病歷號...">
              </div>
              <div class="col-md-3">
                <input type="text" id="filterDocWard" class="form-control form-control-lg border-primary" placeholder="🔍 搜尋 病房床號...">
              </div>
              <div class="col-md-3">
                <input type="text" id="filterDocDisp" class="form-control form-control-lg border-primary" placeholder="🔍 搜尋 附加資訊...">
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover table-striped align-middle fs-5 border">
                <thead class="table-primary">
                  <tr>
                    <th width="15%">日期 / 狀態</th>
                    <th width="15%">文件類型</th>
                    <th width="40%">病房 / 病歷號 / 附加資訊</th>
                    <th width="30%">經手歷程 (人員與時間)</th>
                  </tr>
                </thead>
                <tbody id="docRecordsBody"></tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
<script>
    let allMedsData = [];
    let allDocsData = [];
    let allUdData = []; // ★ 新增這行
    let medChartInstance = null;
    let docChartInstance = null;
    let udChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
      
      document.getElementById('filterMedDisp').addEventListener('input', renderMeds);
      document.getElementById('filterMedChart').addEventListener('input', renderMeds);
      
      document.getElementById('filterDocType').addEventListener('change', renderDocs);
      document.getElementById('filterDocChart').addEventListener('input', renderDocs);
      document.getElementById('filterDocWard').addEventListener('input', renderDocs);
      document.getElementById('filterDocDisp').addEventListener('input', renderDocs);

      
      document.getElementById('filterUndispensed').addEventListener('input', renderUndispensed);
      document.getElementById('udRxDate').value = today; // 表單預設今天

      // ★ 攔截：點擊 未發藥交接紀錄 分頁時，檢查是否已登入藥師
      document.getElementById('undispensed-tab').addEventListener('show.bs.tab', async (e) => {
        const pharmaId = sessionStorage.getItem('pharmaId');
        if (!pharmaId) {
          e.preventDefault(); // 阻擋未登入直接進入
          const { value: loginId } = await Swal.fire({
            title: '藥師身分驗證',
            input: 'text',
            inputPlaceholder: '請輸入藥師員工編號',
            showCancelButton: true,
            confirmButtonText: '登入',
            cancelButtonText: '取消',
            confirmButtonColor: '#dc3545'
          });

          if (loginId) {
            Swal.fire({ title: '驗證中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const res = await callGAS('pharmacistLogin', { staffId: loginId.trim().toUpperCase() });
            if (res.success) {
              // 通過驗證，寫入 sessionStorage 
              sessionStorage.setItem('pharmaId', res.staffId);
              sessionStorage.setItem('pharmaName', res.name);
              Swal.fire({ icon: 'success', title: `歡迎 ${res.name} 藥師`, timer: 1500, showConfirmButton: false });
              
              // 登入成功，手動切換至該分頁
              const tab = new bootstrap.Tab(document.getElementById('undispensed-tab'));
              tab.show();
            } else {
              Swal.fire('登入失敗', res.message, 'error');
            }
          }
        }
      });

      // ★ 綁定表單送出事件
      document.getElementById('undispensedForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pharmaId = sessionStorage.getItem('pharmaId');
        const pharmaName = sessionStorage.getItem('pharmaName');
        
        if(!pharmaId) {
          Swal.fire('錯誤', '登入憑證已失效，請重新整理頁面。', 'error');
          return;
        }

        const rawRxDate = document.getElementById('udRxDate').value.replace(/-/g, ''); // 轉成純數字
        const payload = {
          clinicType: document.getElementById('udClinicType').value,
          rxDate: rawRxDate, 
          dispenseNo: document.getElementById('udDispenseNo').value.trim(),
          problemCategory: document.getElementById('udCategory').value,
          note: document.getElementById('udNote').value.trim(),
          pharmaId: pharmaId,
          pharmaName: pharmaName
        };

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        const res = await callGAS('submitUndispensedRecord', payload);
        if (res.success) {
          Toast.fire({ icon: 'success', title: '新增紀錄成功' });
          e.target.reset(); // 清空表單
          document.getElementById('udRxDate').value = document.getElementById('startDate').value; // 恢復成篩選器日期
          loadRecords(); // 重新向伺服器要資料刷新清單
        } else {
          Swal.fire('失敗', res.message, 'error');
        }
        btn.disabled = false;
        btn.innerHTML = '送出';
      });
      
      loadRecords();
    });

    async function loadRecords() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if(!start || !end) return;

      const medBody = document.getElementById('medRecordsBody');
      const docBody = document.getElementById('docRecordsBody');
      const udBody = document.getElementById('undispensedRecordsBody'); // ★ 新增
      
      medBody.innerHTML = '<tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-success"></div><p class="mt-2">資料讀取中...</p></td></tr>';
      docBody.innerHTML = '<tr><td colspan="4" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">資料讀取中...</p></td></tr>';
      udBody.innerHTML = '<tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-danger"></div><p class="mt-2">資料讀取中...</p></td></tr>';

      const payload = { startDate: start, endDate: end };

      // ★ 新增取得未發藥交接紀錄
      const [medRes, docRes, udRes] = await Promise.all([
        callGAS('getDailyRecords', payload),
        callGAS('getPublicDocRecords', payload),
        callGAS('getUndispensedRecords', payload)
      ]);

      allMedsData = medRes.success ? medRes.data : [];
      allDocsData = docRes.success ? docRes.data : [];
      allUdData = udRes.success ? udRes.data : [];

      populateDocTypes();
      renderMeds();
      renderDocs();
      renderUndispensed(); // ★ 渲染新表格
      renderDashboard(); // ★ 渲染統計圖表
    }

    function populateDocTypes() {
      const select = document.getElementById('filterDocType');
      const currentVal = select.value;
      const uniqueTypes = [...new Set(allDocsData.map(r => r.DocType))].filter(Boolean);
      
      let optionsHtml = '<option value="">📁 所有文件類型</option>';
      uniqueTypes.forEach(type => {
        optionsHtml += `<option value="${type}">${type}</option>`;
      });
      select.innerHTML = optionsHtml;
      if (uniqueTypes.includes(currentVal)) select.value = currentVal;
    }

    // 將 20260205 轉成 2026/02/05 格式顯示
    function formatRxDate(rawStr) {
      if (!rawStr || rawStr.length !== 8) return rawStr;
      return `${rawStr.substring(0, 4)}/${rawStr.substring(4, 6)}/${rawStr.substring(6, 8)}`;
    }

    function renderMeds() {
      const dispFilter = document.getElementById('filterMedDisp').value.trim().toLowerCase();
      const chartFilter = document.getElementById('filterMedChart').value.trim().toLowerCase();
      
      const startVal = document.getElementById('startDate').value.replace(/-/g, '');
      const endVal = document.getElementById('endDate').value.replace(/-/g, '');
      
      const filtered = allMedsData.filter(r => {
        // ★ 強制將可能為數字的欄位加上 String()，防止 toLowerCase() 報錯
        const matchDisp = String(r.dispNo || '').toLowerCase().includes(dispFilter);
        const matchChart = String(r.chartNo || '').toLowerCase().includes(chartFilter);
        
        const rawRx = String(r.rxDate || '').replace(/[^0-9]/g, '');
        const matchDate = (!startVal || rawRx >= startVal) && (!endVal || rawRx <= endVal);
        
        return matchDisp && matchChart && matchDate;
      });

      const tbody = document.getElementById('medRecordsBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">查無符合條件的紀錄</td></tr>`;
        return;
      }

      // 歸戶邏輯
      const groupedData = {};
      filtered.forEach(r => {
        const uniqueKey = r.barcode || `${r.dispNo}_${r.rxDate}_${r.chartNo}`;
        if (!groupedData[uniqueKey]) {
          groupedData[uniqueKey] = { 
            dispNo: r.dispNo,
            rxDate: r.rxDate, 
            chartNo: r.chartNo, 
            records: [] 
          };
        }
        groupedData[uniqueKey].records.push(r);
      });

      // 排序：由小至大
      const sortedKeys = Object.keys(groupedData).sort((a, b) => {
        const numA = parseInt(groupedData[a].dispNo, 10);
        const numB = parseInt(groupedData[b].dispNo, 10);
        if (!isNaN(numA) && !isNaN(numB)) {
          if (numA === numB) return a.localeCompare(b);
          return numA - numB; 
        } 
        return groupedData[a].dispNo.localeCompare(groupedData[b].dispNo); 
      });

      let html = '';
      sortedKeys.forEach((key, index) => {
        const group = groupedData[key];
        const dispNo = group.dispNo; 
        const collapseId = `collapseMed_${index}`;
        
        // 將群組內的紀錄依時間排序(最新的在前面)
        group.records.sort((a, b) => new Date(b.Created || 0) - new Date(a.Created || 0));
        const latestRecord = group.records[0];

        const latestType = latestRecord.TaskType || latestRecord.taskType || '未註記';
        let typeBadge = 'bg-secondary';
        if (latestType === '氣送') typeBadge = 'bg-info text-dark';
        else if (latestType === '取消領藥') typeBadge = 'bg-danger text-white'; 
        else if (latestType !== '未註記') typeBadge = 'bg-warning text-dark';

        html += `
          <tr>
            <td>${formatRxDate(group.rxDate)}</td>
            <td class="text-success fw-bold">${dispNo}</td>
            <td>${group.chartNo}</td>
            <td><span class="badge ${typeBadge} fs-6">${latestType}</span></td>
            <td>
              <span class="text-primary fw-bold">${latestRecord.staffName} (${latestRecord.staffId})</span> 
              <span class="text-muted small ms-1">${latestRecord.Created}</span>
            </td>
            <td><span class="badge bg-secondary rounded-pill">${group.records.length} 筆</span></td>
            <td>
              <button class="btn btn-outline-success btn-sm fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                詳細紀錄 <i class="bi bi-chevron-down"></i>
              </button>
            </td>
          </tr>
          <tr class="collapse sub-table-row" id="${collapseId}">
            <td colspan="7" class="p-3">
              <table class="table table-sm table-bordered mb-0 bg-white">
                <thead class="table-light"><tr><th>處方日期</th><th>傳送方式</th><th>經手人員</th><th>刷入日期與時間</th></tr></thead>
                <tbody>
                  ${group.records.map(sub => {
                    const subType = sub.TaskType || sub.taskType || '未註記';
                    let subTypeBadge = 'bg-secondary';
                    if (subType === '氣送') subTypeBadge = 'bg-info text-dark';
                    else if (subType === '取消領藥') subTypeBadge = 'bg-danger text-white'; 
                    else if (subType !== '未註記') subTypeBadge = 'bg-warning text-dark';
                    
                    return `<tr><td>${formatRxDate(sub.rxDate)}</td><td><span class="badge ${subTypeBadge}">${subType}</span></td><td>${sub.staffName} (${sub.staffId})</td><td>${sub.Created}</td></tr>`;
                  }).join('')}
                </tbody>
              </table>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function renderDocs() {
      const typeFilter = document.getElementById('filterDocType').value; 
      const chartFilter = document.getElementById('filterDocChart').value.trim().toLowerCase();
      const wardFilter = document.getElementById('filterDocWard').value.trim().toLowerCase();
      const dispFilter = document.getElementById('filterDocDisp').value.trim().toLowerCase();

      const filtered = allDocsData.filter(r => {
        // ★ 強制將可能為數字的欄位加上 String()
        const rawSearchText = `${String(r.SendNote || '')} ${String(r.ReceiveNote || '')} ${String(r.Quantity || '')} ${String(r.PickupNo || '')} ${String(r.SenderName || '')} ${String(r.SenderId || '')}`.toLowerCase();
        const matchType = typeFilter === "" ? true : String(r.DocType || '') === typeFilter; 
        const matchChart = String(r.ChartNo || '').toLowerCase().includes(chartFilter);
        const matchWard = String(r.Ward || '').toLowerCase().includes(wardFilter);
        const matchDisp = rawSearchText.includes(dispFilter);
        return matchType && matchChart && matchWard && matchDisp;
      }).sort((a, b) => {
        const getLatestTime = (item) => {
          if (item.ReturnTime) return new Date(item.ReturnTime);
          if (item.ReceiveTime) return new Date(item.ReceiveTime);
          return new Date(item.SendTime || 0); 
        };
        return getLatestTime(b) - getLatestTime(a); 
      });

      const tbody = document.getElementById('docRecordsBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">查無符合條件的紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        let statusBadge = 'bg-warning text-dark';
        if (r.Status === '退件') statusBadge = 'bg-danger text-white';
        else if (r.Status.includes('已結案') || r.Status.includes('已領回') || r.Status === '收下不歸還') statusBadge = 'bg-secondary text-white';
        else if (r.Status !== '待藥師收單') statusBadge = 'bg-primary text-white';

        let detailsArr = [];
        if(r.Ward) detailsArr.push(`病房: <span class="text-primary fw-bold">${r.Ward}</span>`);
        if(r.ChartNo) detailsArr.push(`病歷: <span class="text-dark fw-bold">${r.ChartNo}</span>`);
        if(r.Quantity) detailsArr.push(`數量: <span class="text-danger fw-bold">${r.Quantity}</span>`);
        if(r.PickupNo) detailsArr.push(`領藥號: <span class="text-success fw-bold">${r.PickupNo}</span>`);
        
        // ★ 對齊卡片的時間與員編格式
        const senderStr = r.SenderId ? `${r.SenderName} (${r.SenderId})` : r.SenderName;
        const returnerStr = r.ReturnerId ? `${r.ReturnerName} (${r.ReturnerId})` : (r.ReturnerName || '');
        
        const formatTime = (t) => t ? String(t).substring(5, 16).replace('-', '/') : '';
        const sendTimeStr = formatTime(r.SendTime);
        const receiveTimeStr = formatTime(r.ReceiveTime);
        const returnTimeStr = formatTime(r.ReturnTime);
        
        const dateOnly = r.SendTime ? String(r.SendTime).substring(0, 10) : ''; 

        return `
        <tr>
          <td>
            <div class="fw-bold text-secondary mb-1">${dateOnly}</div>
            <span class="badge ${statusBadge} fs-6 d-inline-block mb-1">${r.Status}</span>
          </td>
          
          <td class="fw-bold fs-5 text-dark">${r.DocType || ''}</td>
          
          <td>
            <div class="mb-2 text-secondary">${detailsArr.join(' <span class="mx-2 text-black-50 fw-light">|</span> ')}</div>
            ${r.SendNote ? `<div class="bg-light p-1 rounded small text-danger border mb-1"><i class="bi bi-person-walking me-1"></i>送件備註: ${r.SendNote}</div>` : ''}
            ${r.ReceiveNote ? `<div class="bg-blue-light p-1 rounded small text-primary border mb-1" style="background-color: #e7f1ff;"><i class="bi bi-capsule me-1"></i>藥師回覆: ${r.ReceiveNote}</div>` : ''}
          </td>
          
          <td>
            <ul class="list-unstyled mb-0 small text-muted">
              <li class="mb-1">
                <i class="bi bi-person-walking text-dark me-1"></i>送件: <strong class="text-dark">${senderStr}</strong> 
                <span class="ms-1 text-black-50">${sendTimeStr}</span>
              </li>
              ${r.IsReceived ? `
              <li class="mb-1">
                <i class="bi bi-capsule text-primary me-1"></i>藥師: <strong class="text-primary">${r.PharmaName || ''}</strong> 
                <span class="ms-1 text-black-50">${receiveTimeStr}</span>
              </li>` : ''}
              ${r.ReturnerName ? `
              <li>
                <i class="bi bi-check2-circle text-success me-1"></i>領回: <strong class="text-success">${returnerStr}</strong> 
                <span class="ms-1 text-black-50">${returnTimeStr}</span>
              </li>` : ''}
            </ul>
          </td>
        </tr>
      `}).join('');
    }

    function renderUndispensed() {
      const filterText = document.getElementById('filterUndispensed').value.trim().toLowerCase();
      const tbody = document.getElementById('undispensedRecordsBody');

      // 全欄位轉成小寫字串進行模糊搜尋，並依照 createdTime 降冪排序 (最新的在最上面)
      const filtered = allUdData.filter(r => {
        const rawString = `${r.clinicType} ${r.rxDate} ${r.dispenseNo} ${r.problemCategory} ${r.note} ${r.pharmaName} ${r.pharmaId}`.toLowerCase();
        return rawString.includes(filterText);
      }).sort((a, b) => new Date(b.createdTime || 0) - new Date(a.createdTime || 0));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">查無符合條件的紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        return `
        <tr>
          <td class="text-muted">${r.createdTime}</td>
          <td>${formatRxDate(r.rxDate)}</td>
          <td><span class="badge bg-secondary">${r.clinicType}</span></td>
          <td class="text-danger fw-bold fs-5">${r.dispenseNo}</td>
          <td><span class="badge bg-danger">${r.problemCategory}</span></td>
          <td>${r.note}</td>
          <td><span class="text-primary fw-bold">${r.pharmaName}</span> <span class="small text-muted">(${r.pharmaId})</span></td>
        </tr>
        `;
      }).join('');
    }

    function renderDashboard() {
      // 1. 更新 KPI 數字
      document.getElementById('kpi-meds').textContent = allMedsData.length;
      document.getElementById('kpi-docs').textContent = allDocsData.length;
      document.getElementById('kpi-ud').textContent = allUdData.length;

      // 2. 準備出院帶藥/氣送資料 (環圈圖)
      const medTypes = {};
      allMedsData.forEach(d => {
        const t = d.TaskType || d.taskType || '未註記';
        medTypes[t] = (medTypes[t] || 0) + 1;
      });

      if (medChartInstance) medChartInstance.destroy();
      medChartInstance = new Chart(document.getElementById('medChart'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(medTypes),
          datasets: [{
            data: Object.values(medTypes),
            backgroundColor: ['#198754', '#0dcaf0', '#dc3545', '#ffc107', '#6c757d']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
      });

      // 3. 準備文件收發資料 (長條圖)
      const docTypes = {};
      allDocsData.forEach(d => {
        const t = d.DocType || '未註記';
        docTypes[t] = (docTypes[t] || 0) + 1;
      });
      
      if (docChartInstance) docChartInstance.destroy();
      docChartInstance = new Chart(document.getElementById('docChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(docTypes),
          datasets: [{
            label: '文件數量',
            data: Object.values(docTypes),
            backgroundColor: '#0d6efd',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      // 4. 準備未發藥交接資料 (長條圖)
      const udTypes = {};
      allUdData.forEach(d => {
        const t = d.problemCategory || '未註記';
        udTypes[t] = (udTypes[t] || 0) + 1;
      });

      if (udChartInstance) udChartInstance.destroy();
      udChartInstance = new Chart(document.getElementById('udChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(udTypes),
          datasets: [{
            label: '問題數量',
            data: Object.values(udTypes),
            backgroundColor: '#dc3545',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });
    }
      </script>
</body>
